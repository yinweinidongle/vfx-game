name: One-time import and deploy
on:
  push:
    branches: [main]
    paths: [.github/workflows/bootstrap.yml]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  import-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Import verified project files
        run: |
          curl --fail --location --retry 3 --output /tmp/frostbound-project.tar.gz 'https://game.xqsingular.com/frostbound-import-ca74719d3a0a4d84ad16e974fdf88050.tar.gz'
          echo 'ad9890137d6e25c103fb310cedee9a154a05eb819698dff59923bc98cea0519c  /tmp/frostbound-project.tar.gz' | sha256sum --check
          tar -xzf /tmp/frostbound-project.tar.gz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Import complete Frostbound project'
          git push origin HEAD:main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE_PATH: /vfx-game/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: import-and-build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
