map $uri $frostbound_cache {
    default "public, max-age=3600, must-revalidate";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~*\.(html|json)$ "no-cache";
    / "no-cache";
}

server {
    listen 80;
    server_name game.xqsingular.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/frostbound/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://game.xqsingular.com$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name game.xqsingular.com;
    root /var/www/frostbound/current;
    index game.html;

    ssl_certificate /etc/letsencrypt/live/game.xqsingular.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.xqsingular.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FrostboundTLS:2m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control $frostbound_cache;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/frostbound.access.log;
    error_log /var/log/nginx/frostbound.error.log warn;

    location = / { try_files /game.html =404; }
    location / { try_files $uri =404; }
    location ~ /\. { return 404; }
}
